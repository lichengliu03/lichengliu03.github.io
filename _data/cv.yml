- title: Academic Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: MLL Lab, Northwestern University (Advisor&#58; Prof. Manling Li)
      year: Mar 2025 - Present
      description:
        - "<b>Try Again — UFO:</b> Identified a key failure mode of single-turn RLVR (models stop revising under feedback). Proposed <i>Unary Feedback as Observation (UFO)</i>, a multi-turn RL formulation that injects minimal unary feedback as the environment observation, enabling multi-turn training on static single-turn datasets and improving multi-turn reasoning accuracy by up to 14%. Introduced PassSeq@k and reward shaping (turn-wise decay, repetition penalty)."
        - "<b>Reasoning Collapse:</b> Proposed a theoretical framework explaining reasoning collapse in closed-loop multi-turn RL as the interaction of task signal, prompt-agnostic regularizers, and reward noise; developed an SNR / reward-variance mechanism and a taxonomy of collapse modes."
        - "<b>RAGEN:</b> Contributed to the RAGEN framework for training LLM reasoning agents in interactive, stochastic environments (2400+ GitHub stars); assisted in theoretical development and paper writing."
    - title: Research Collaborator
      institution: UC Berkeley (Advisors&#58; Prof. Joseph Gonzalez, Prof. Ion Stoica)
      year: Ongoing
      description:
        - Contributing to the <b>Real-Time Audio Tool Benchmark</b>, evaluating whether models can recognize user needs, invoke appropriate tools, and complete tasks from spoken requests.
        - Designed <b>implicit-instruction</b> tasks that test inference of latent user intent from speech content.
        - Responsible for the benchmark <b>infrastructure</b> and end-to-end evaluation pipeline.
    - title: Research Intern
      institution: MIT (Advisor&#58; Mingda Qiao)
      year: May 2024 - May 2025
      description:
        - Studied <b>online prediction under limited selectivity</b>, generalizing selective prediction to realistic forecasting constraints.
        - Introduced the <b>Prediction with Limited Selectivity (PLS)</b> model and an instance-dependent complexity measure (approximate uniformity).
        - Proved matching upper and lower bounds, with an average-case analysis showing tightness up to constants.
        - First-authored paper accepted to <b>NeurIPS 2025 as a Spotlight</b>.

